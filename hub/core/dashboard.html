<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents hub</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  /* Layout: a slim header (logo, one status line, Settings), two quiet tabs, then one view at a time.
     Activity: the agents as one row of filters, the jobs list, a side panel for one job.
     Memory: the on-call memory as a readable page. Everything you set lives in the Settings panel. */
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1b2130; --muted: #667080; --line: #e1e5eb; --soft: #eef1f5;
    --accent: #d97757; --accent-ink: #b85a3c; --ok: #1f8a55; --warn: #b7791f; --bad: #c8423f; --code: #f3f5f8;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318; --panel: #171b22; --text: #e6e9ee; --muted: #98a2b0; --line: #283039; --soft: #1f252e;
      --accent: #e08a6c; --accent-ink: #f0a487; --ok: #4cc283; --warn: #e0a84a; --bad: #ef6b6b; --code: #12161c;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  a { color: var(--accent-ink); }
  button { font: inherit; color: var(--text); background: none; border: 1px solid var(--line); border-radius: 7px;
           padding: 4px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
                  border-radius: 7px; padding: 4px 8px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.run { background: var(--accent); }
  .dot.warn { background: var(--warn); }

  header { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
  h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .logo { width: 22px; height: 22px; border-radius: 6px; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-right: auto; }
  .tabs { display: flex; gap: 2px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 12px; color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 48px; }

  /* Activity */
  .agents { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .agent { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 4px 12px; font-size: 13px;
           background: var(--panel); }
  .agent.on { border-color: var(--accent); background: var(--soft); }
  .agent .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1000px) { .layout.open { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .listhead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .listhead h2 { font-size: 13px; margin: 0 auto 0 0; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
  .seg button.on { background: var(--soft); color: var(--text); }
  .job { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 1px 10px; padding: 10px 14px;
         border-top: 1px solid var(--line); cursor: pointer; align-items: baseline; }
  .job:first-child { border-top: 0; }
  .job:hover, .job.sel { background: var(--soft); }
  .job .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .job .meta { grid-column: 2 / 4; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .job .meta .err { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .empty { padding: 22px 14px; color: var(--muted); }
  .detail { padding: 14px 16px; align-self: start; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  .detail h2 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
  .detail .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .detail .head { display: flex; justify-content: space-between; gap: 10px; }
  .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 12px; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 6px 0;
        white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); }
  pre.log { max-height: 50vh; overflow: auto; }

  /* Memory */
  .memory { max-width: 760px; margin: 0 auto; }
  .memmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 13px;
             margin-bottom: 14px; }
  .memmeta .spacer { margin-left: auto; }
  .linkbtn { border: 0; padding: 0; color: var(--accent-ink); background: none; }
  .doc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 28px 24px; }
  .doc h1 { font-size: 20px; margin: 18px 0 6px; display: block; }
  .doc h2 { font-size: 15px; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .doc h3 { font-size: 14px; margin: 18px 0 4px; }
  .doc p { margin: 6px 0; max-width: 68ch; }
  .doc ul, .doc ol { margin: 4px 0 8px; padding-left: 20px; max-width: 68ch; }
  .doc li { margin: 2px 0; }
  .doc code { font: 12.5px var(--mono); background: var(--code); border-radius: 4px; padding: 1px 4px; }
  .entries { margin-top: 16px; }
  .entry { border-top: 1px solid var(--line); padding: 10px 14px; }
  .entry:first-child { border-top: 0; }
  .entry summary { cursor: pointer; display: grid; gap: 2px; list-style: none; }
  .entry summary::-webkit-details-marker { display: none; }
  .entry .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .entry .first { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shiftline { padding: 6px 14px; font-size: 12px; color: var(--muted); background: var(--soft); }

  /* Settings */
  dialog { border: 0; padding: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(440px, 100%);
           background: var(--panel); color: var(--text); box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  dialog::backdrop { background: rgba(10, 14, 20, .35); }
  .sheet { padding: 18px 20px 40px; display: grid; gap: 22px; }
  .sheet .top { display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 { font-size: 15px; margin: 0; }
  .sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .engine { display: grid; gap: 6px; margin-bottom: 12px; }
  .engine .name { font-size: 13px; }
  .engine .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .engine select { flex: 1 1 140px; min-width: 0; }
  .seg.engines button { padding: 3px 12px; }
  .plugin { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .plugin:first-of-type { border-top: 0; }
  .plugin .grow { flex: 1; min-width: 0; }
  .plugin .why { font-size: 12px; color: var(--muted); }
  .cmd { display: flex; gap: 6px; }
  .cmd input { flex: 1; min-width: 0; }
  #reply { margin-top: 8px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel);
           padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: min(560px, 90vw); z-index: 10; }
</style>
</head>
<body>
<header>
  <h1><img class="logo" src="/favicon.png" alt="">Agents</h1>
  <span id="status"><span class="dot"></span><span>connecting…</span></span>
  <button id="open-settings" type="button">Settings</button>
</header>
<nav class="tabs" aria-label="Views">
  <button id="tab-activity" class="on" type="button">Activity</button>
  <button id="tab-memory" type="button">On-call memory</button>
</nav>

<main>
  <section id="activity">
    <div class="agents" id="agents"></div>
    <div class="layout" id="layout">
      <section class="panel">
        <div class="listhead">
          <h2 id="list-title">All jobs</h2>
          <div class="seg" id="f-status">
            <button type="button" data-status="" class="on">All</button>
            <button type="button" data-status="running">Running</button>
            <button type="button" data-status="failed">Failed</button>
          </div>
        </div>
        <div id="jobs"></div>
      </section>
      <section class="panel detail" id="detail" hidden></section>
    </div>
  </section>

  <section id="memory" class="memory" hidden>
    <div class="memmeta">
      <span id="mem-shift"><span class="dot"></span> <span></span></span>
      <span id="mem-updated"></span>
      <span class="spacer"></span>
      <button class="linkbtn" id="mem-raw" type="button">Show the entries</button>
      <button class="linkbtn" id="mem-rebuild" type="button">Rebuild</button>
    </div>
    <article class="doc" id="mem-doc"></article>
    <section class="panel entries" id="mem-entries" hidden></section>
  </section>
</main>

<dialog id="settings" aria-label="Settings">
  <div class="sheet">
    <div class="top"><h2>Settings</h2><button id="close-settings" type="button">Close</button></div>
    <section>
      <h3>Models</h3>
      <div class="engine" data-scope="all">
        <div class="name">Every agent</div>
        <div class="controls">
          <div class="seg engines"><button type="button" data-engine="codex">Codex</button><button type="button" data-engine="claude">Claude</button></div>
          <select id="model" aria-label="model"></select>
          <select id="effort" aria-label="effort"></select>
        </div>
      </div>
      <div class="engine" data-scope="reviews">
        <div class="name">PR reviews</div>
        <div class="controls">
          <div class="seg engines"><button type="button" data-engine="codex">Codex</button><button type="button" data-engine="claude">Claude</button></div>
          <select id="rev-model" aria-label="PR review model"></select>
          <select id="rev-effort" aria-label="PR review effort"></select>
        </div>
      </div>
    </section>
    <section>
      <h3>Agents</h3>
      <div id="plugin-list"></div>
    </section>
    <section>
      <h3>Slack</h3>
      <div id="slack-line" class="muted"></div>
    </section>
    <section>
      <h3>Command</h3>
      <div class="cmd"><input id="cmd" placeholder="status, jobs failed, oncall search outbox…" autocomplete="off"><button id="run" type="button">Run</button></div>
      <pre id="reply" hidden></pre>
    </section>
  </div>
</dialog>
<div id="toast" hidden></div>

<script>
"use strict";
let token = null, state = null, selected = null, tail = { id: null, offset: 0, timer: null };
const view = { agent: "", status: "", tab: "activity" };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function ago(t) {
  if (!t) return "-";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - t));
  if (s >= 86400) return Math.floor(s / 86400) + "d ago";
  if (s >= 3600) return Math.floor(s / 3600) + "h ago";
  if (s >= 60) return Math.floor(s / 60) + "m ago";
  return s + "s ago";
}
function dur(a, b) {
  if (!a) return "";
  const s = Math.max(0, Math.floor((b || Date.now() / 1000) - a));
  return s >= 3600 ? Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m" : s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s";
}
function safeLink(url) { return /^https?:\/\//i.test(url || "") ? url : null; }
function resumeCommand(job) {
  if (job.payload && job.payload.resume_command) return job.payload.resume_command;
  if (!job.session) return null;
  const m = /^(codex|claude):(.*)$/.exec(job.session);
  const engine = m ? m[1] : "claude", id = m ? m[2] : job.session;
  return engine === "codex" ? `cd ~/dev/envoyai-backend && codex resume ${id}` : `cd ~/dev/envoyai-backend && claude --resume ${id}`;
}
const statusDot = (s) => ({ running: "dot run", queued: "dot warn", done: "dot ok", failed: "dot bad" }[s] || "dot");

async function getJSON(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
function toast(text) {
  const t = $("toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 3500);
}
async function command(words, { show = false } = {}) {
  if (!token) token = (await getJSON("/api/token")).token;
  const r = await fetch("/api/command", { method: "POST", headers: { "Content-Type": "application/json", "X-Hub-Token": token },
                                          body: JSON.stringify({ words }) });
  const data = await r.json().catch(() => ({}));
  const text = data.reply || data.error || ("HTTP " + r.status);
  if (show) { const box = $("reply"); box.hidden = false; box.textContent = "› " + words.join(" ") + "\n" + text; }
  else toast(text.split("\n")[0]);
  refresh();
  return text;
}

function fillSelect(select, items, value) {
  // Rebuild only when the choices changed, so an open dropdown isn't reset by the refresh.
  const key = JSON.stringify(items);
  if (select.dataset.key !== key) {
    select.replaceChildren(...items.map(([v, label]) => { const o = document.createElement("option"); o.value = v; o.textContent = label; return o; }));
    select.dataset.key = key;
  }
  if (document.activeElement !== select) select.value = value;
}
function renderPickers(s, choice, prefix, scope) {
  const name = choice.engine, pick = choice[name] || {}, models = (s.engine_options || {})[name] || [];
  const items = models.map((m) => [m.slug, m.label === m.slug ? m.slug : `${m.label} (${m.slug})`]);
  if (!pick.model) items.unshift(["", "default model"]);
  fillSelect($(prefix + "model"), items, pick.model || "");
  const info = models.find((m) => m.slug === pick.model);
  const efforts = (info ? info.efforts : ["low", "medium", "high", "xhigh", "max"]).map((e) => [e, e + " effort"]);
  efforts.unshift(["default", "default effort" + (info && info.default_effort ? ` (${info.default_effort})` : "")]);
  fillSelect($(prefix + "effort"), efforts, pick.effort || "default");
  for (const b of document.querySelectorAll(`.engine[data-scope="${scope}"] [data-engine]`)) b.classList.toggle("on", b.dataset.engine === name);
}

// ------------------------------------------------------------------ the header, the agents, the settings
function renderStatus(s) {
  const alive = Date.now() / 1000 - s.heartbeat_at < 60;
  const bits = [alive ? "hub up " + dur(s.started_at).replace(/ \d+s$/, "") : "hub not responding"];
  if (s.slack) bits.push(s.slack.connected ? "Slack connected" : "Slack down");
  bits.push(s.running.length ? `${s.running.length} running` : "idle");
  const box = $("status"); box.firstChild.className = "dot " + (!alive || (s.slack && !s.slack.connected) ? "bad" : s.running.length ? "run" : "ok");
  box.lastChild.textContent = bits.join(" · ");
}

function renderAgents(s) {
  const box = $("agents"); box.replaceChildren();
  for (const [name, p] of Object.entries(s.plugins)) {
    const c = (s.counts || {})[name] || {};
    const b = el("button", "agent" + (view.agent === name ? " on" : "")); b.type = "button";
    b.append(el("span", "dot " + (p.paused ? "" : c.running ? "run" : "ok")), el("span", null, p.title || name));
    const n = [c.running ? `${c.running} running` : "", c.queued ? `${c.queued} queued` : "", c.failed ? `${c.failed} failed` : ""].filter(Boolean).join(" · ");
    if (p.paused) b.append(el("span", "n", "paused")); else if (n) b.append(el("span", "n", n));
    b.title = p.paused ? "paused: its jobs wait until you resume it in Settings" : "show only this agent's jobs";
    b.onclick = () => { view.agent = view.agent === name ? "" : name; renderAgents(s); renderJobs(s); };
    box.append(b);
  }
}

function renderSettings(s) {
  renderPickers(s, s.engine, "", "all");
  if (s.review_engine) renderPickers(s, s.review_engine, "rev-", "reviews");
  const list = $("plugin-list"); list.replaceChildren();
  for (const [name, p] of Object.entries(s.plugins)) {
    const row = el("div", "plugin"), grow = el("div", "grow");
    grow.append(el("div", null, p.title || name), el("div", "why", `${name} · ${p.max_concurrent} at a time`));
    const b = el("button", null, p.paused ? "Resume" : "Pause"); b.type = "button";
    b.onclick = () => command([p.paused ? "resume" : "pause", name]);
    row.append(el("span", "dot " + (p.paused ? "" : "ok")), grow, b); list.append(row);
  }
  for (const name of s.broken || []) list.append(el("div", "plugin err", `${name} failed to load`));
  $("slack-line").textContent = !s.slack ? "Slack is off" : s.slack.connected
    ? `Signed in as @${s.slack.bot || "?"}${s.slack.dm_as_user ? ", answers as you in DMs" : ""}`
    : "Not connected" + (s.slack.error ? ": " + s.slack.error : "");
}

// ------------------------------------------------------------------ jobs
function renderJobs(s) {
  const list = $("jobs"); list.replaceChildren();
  $("list-title").textContent = view.agent ? ((s.plugins[view.agent] || {}).title || view.agent) : "All jobs";
  const jobs = s.jobs.filter((j) => (!view.agent || j.plugin === view.agent) && (!view.status || j.status === view.status));
  if (!jobs.length) { list.append(el("div", "empty", view.status ? `Nothing ${view.status}.` : "No jobs yet.")); return; }
  for (const j of jobs) {
    const row = el("div", "job" + (selected === j.id ? " sel" : ""));
    row.onclick = () => openJob(j.id);
    row.append(el("span", statusDot(j.status)), el("span", "title", j.title), el("span", "when", ago(j.created)));
    const meta = el("div", "meta");
    meta.append(el("span", null, (s.plugins[j.plugin] || {}).title || j.plugin));
    if (j.started) meta.append(el("span", null, dur(j.started, j.finished)));
    if (j.status === "failed" && j.error) meta.append(el("span", "err", j.error.slice(0, 160)));
    else if (j.summary) meta.append(el("span", null, j.summary.slice(0, 120)));
    row.append(meta); list.append(row);
  }
}

async function openJob(id) {
  selected = id; clearTimeout(tail.timer);
  const data = await getJSON("/api/jobs/" + encodeURIComponent(id));
  const j = data.job, box = $("detail");
  $("layout").classList.add("open"); box.hidden = false; box.replaceChildren();
  const head = el("div", "head"), close = el("button", null, "Close"); close.type = "button";
  close.onclick = () => { selected = null; clearTimeout(tail.timer); box.hidden = true; $("layout").classList.remove("open"); if (state) renderJobs(state); };
  head.append(el("h2", null, j.title), close); box.append(head);
  box.append(el("div", "muted", `${j.status} · ${(state && state.plugins[j.plugin] || {}).title || j.plugin} · ${ago(j.created)}`
    + `${j.started ? " · took " + dur(j.started, j.finished) : ""}${j.engine ? " · " + j.engine : ""}`
    + `${j.tokens ? " · " + j.tokens.toLocaleString() + " tokens" : ""}${j.cost != null ? " · $" + Number(j.cost).toFixed(2) : ""}`));
  const actions = el("div", "row");
  const link = safeLink(j.link);
  if (link) { const a = el("a", null, "Open result ↗"); a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer"; actions.append(a); }
  const act = (label, words) => { const b = el("button", null, label); b.type = "button"; b.onclick = () => command(words); actions.append(b); };
  if (j.status === "running" || j.status === "queued") act("Cancel", ["cancel", j.id]); else act("Run again", ["retry", j.id]);
  const resume = resumeCommand(j);
  if (resume) {
    const b = el("button", null, "Copy resume command"); b.type = "button";
    b.onclick = () => navigator.clipboard.writeText(resume).then(() => toast("Copied: " + resume), () => toast(resume));
    actions.append(b);
  }
  box.append(actions);
  if (j.error) box.append(el("pre", "err", j.error));
  if (j.summary) box.append(el("div", "label", "Result"), el("pre", null, j.summary));
  box.append(el("div", "label", "What the agent did"));
  const log = el("pre", "log", data.events.join("\n") || "(nothing yet)"); box.append(log);
  log.scrollTop = log.scrollHeight;
  tail = { id, offset: data.offset, timer: null };
  if (j.status === "running" || j.status === "queued") follow(id, log);
  if (state) renderJobs(state);
}

async function follow(id, log) {
  if (selected !== id) return;
  try {
    const data = await getJSON(`/api/jobs/${encodeURIComponent(id)}/events?offset=${tail.offset}`);
    if (selected !== id) return;
    if (data.lines.length) {
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
      log.textContent = (log.textContent === "(nothing yet)" ? "" : log.textContent + "\n") + data.lines.join("\n");
      if (atBottom) log.scrollTop = log.scrollHeight;
    }
    tail.offset = data.offset;
    if (data.status !== "running" && data.status !== "queued") { openJob(id); return; }
  } catch (e) { /* the hub may be restarting; keep trying */ }
  tail.timer = setTimeout(() => follow(id, log), 2000);
}

// ------------------------------------------------------------------ the on-call memory
function inline(text) {
  // Escaped first; then `code`, **bold**, [links](https://…) and bare links.
  let s = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s;
}
function markdown(md) {
  const out = []; let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; } };
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    const h = /^(#{1,3})\s+(.*)$/.exec(line), ul = /^\s*[-*]\s+(.*)$/.exec(line), ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (ul || ol) {
      flushPara(); const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((ul || ol)[1]);
    } else if (!line.trim()) { flushPara(); flushList(); }
    else if (list && /^\s{2,}/.test(raw)) list.items[list.items.length - 1] += " " + line.trim();
    else { flushList(); para.push(line.trim()); }
  }
  flushPara(); flushList();
  return out.join("");
}

const mem = { raw: false, timer: null };
async function loadMemory() {
  let d;
  try { d = await getJSON("/api/oncall?limit=300"); }
  catch (e) { $("mem-doc").replaceChildren(el("p", "err", "Couldn't read the memory: " + e.message)); return; }
  const shift = $("mem-shift");
  shift.firstChild.className = "dot" + (d.shift.on ? " ok" : "");
  shift.lastChild.textContent = d.shift.on ? `On call since ${d.shift.start}`
    : d.shift.start ? `Off call · last shift ${d.shift.start} to ${d.shift.end}` : "No shift recorded";
  $("mem-updated").textContent = (d.memory_updated ? `Updated ${d.memory_updated}` : "")
    + (d.pending ? `${d.memory_updated ? " · " : ""}${d.pending} new entr${d.pending === 1 ? "y" : "ies"} being folded in` : "");
  if (d.memory) $("mem-doc").innerHTML = markdown(d.memory);
  else $("mem-doc").replaceChildren(el("p", "muted", d.count
    ? "The memory is being written from the notebook now. It takes a minute or two."
    : "Nothing yet. Page investigations and notes from your sessions turn into the memory here."));
  $("mem-raw").textContent = mem.raw ? "Hide the entries" : `Show the ${d.count} entries`;
  const box = $("mem-entries"); box.hidden = !mem.raw;
  if (mem.raw) renderEntries(box, d.entries);
}
function renderEntries(box, entries) {
  box.replaceChildren();
  for (const e of entries) {
    if (e.kind === "shift_start" || e.kind === "shift_end") {
      box.append(el("div", "shiftline", (e.kind === "shift_start" ? "Shift started " : "Shift ended ") + e.when)); continue;
    }
    const item = el("details", "entry"), sum = el("summary"), meta = el("div", "meta");
    meta.append(el("span", null, e.when), el("span", null, e.kind), el("span", null, e.source || ""));
    if ((e.monitors || []).length) meta.append(el("span", null, e.monitors.join(", ")));
    const first = (e.text || "").split("\n").find((l) => l.trim()) || "";
    sum.append(el("div", "first", first), meta);
    item.append(sum, el("pre", null, e.text || ""));
    const link = safeLink(e.link);
    if (link) { const a = el("a", null, "Open in Slack ↗"); a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer"; item.append(a); }
    box.append(item);
  }
}

// ------------------------------------------------------------------ tabs, refresh, wiring
function showTab(name) {
  view.tab = name;
  $("tab-activity").classList.toggle("on", name === "activity"); $("tab-memory").classList.toggle("on", name === "memory");
  $("activity").hidden = name !== "activity"; $("memory").hidden = name !== "memory";
  history.replaceState(null, "", name === "memory" ? "#memory" : location.pathname);
  clearInterval(mem.timer);
  if (name === "memory") { loadMemory(); mem.timer = setInterval(loadMemory, 20000); }
}

async function refresh() {
  try {
    state = await getJSON("/api/state");
    renderStatus(state); renderAgents(state); renderJobs(state); renderSettings(state);
  } catch (e) {
    const box = $("status"); box.firstChild.className = "dot bad"; box.lastChild.textContent = "hub not reachable";
  }
}

$("tab-activity").onclick = () => showTab("activity");
$("tab-memory").onclick = () => showTab("memory");
for (const b of $("f-status").querySelectorAll("button")) b.onclick = () => {
  view.status = b.dataset.status;
  for (const x of $("f-status").querySelectorAll("button")) x.classList.toggle("on", x === b);
  if (state) renderJobs(state);
};
$("open-settings").onclick = () => $("settings").showModal();
$("close-settings").onclick = () => $("settings").close();
$("settings").addEventListener("click", (e) => { if (e.target === $("settings")) $("settings").close(); });
for (const box of document.querySelectorAll(".engine")) {
  const scoped = box.dataset.scope === "reviews" ? ["reviews"] : [];
  for (const b of box.querySelectorAll("[data-engine]")) b.onclick = () => command(["engine", ...scoped, b.dataset.engine]);
}
$("model").onchange = () => $("model").value && command(["model", $("model").value]);
$("effort").onchange = () => command(["effort", $("effort").value]);
$("rev-model").onchange = () => $("rev-model").value && command(["model", "reviews", $("rev-model").value]);
$("rev-effort").onchange = () => command(["effort", "reviews", $("rev-effort").value]);
const runCmd = () => { const words = $("cmd").value.trim().split(/\s+/).filter(Boolean); if (words.length) { command(words, { show: true }); $("cmd").value = ""; } };
$("run").onclick = runCmd;
$("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") runCmd(); });
$("mem-raw").onclick = () => { mem.raw = !mem.raw; loadMemory(); };
$("mem-rebuild").onclick = async () => { await command(["oncall", "rebuild"]); loadMemory(); };

if (location.hash === "#memory" || location.hash === "#notebook") showTab("memory");
refresh();
setInterval(refresh, 3000);
</script>
